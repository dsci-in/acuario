[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acuario"
version = "2.0.0"
description = "Multi AI Agent Source Code Auditing Sandbox"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Data Security Council of India", email = "opensource@dsci.in" },
    { name = "Ajay Pandey", email = "ajay.pandey@dsci.in" },
]
maintainers = [
    { name = "Ajay Pandey", email = "ajay.pandey@dsci.in" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # Core
    "aiohttp>=3.8.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    # Network protocols
    "asyncssh>=2.13.0",
    "pysmb>=1.2.6",
    # Reporting
    "jinja2>=3.1.0",
    "reportlab>=4.0.0",
    "genai-pyo3>=0.1.16",
    "pydantic>=2.0.0",
    "docker>=7.0.0",
    # TUI
    "textual>=0.47.0",
    # Web UI
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=11.0",
    # Token counting
    "tiktoken>=0.5.0",
    # Knowledge graph
    "networkx>=3.0",
    # Memory
    "numpy>=1.24.0",
    "chromadb>=1.0.0",
    # Source-hunt pipeline - callgraph extraction
    "tree-sitter>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
]

[project.optional-dependencies]
metasploit = ["pymetasploit3>=1.0.0"]
browser = ["playwright>=1.40.0"]
vector = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "ruff>=0.11.0",
    "build>=1.2.0",
    "twine>=6.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]
all = [
    "acuario[metasploit,browser,vector,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/dsci-in/acuario"
Repository = "https://github.com/dsci-in/acuario"
Issues = "https://github.com/dsci-in/acuario/issues"
Documentation = "https://github.com/dsci-in/acuario/tree/main/docs"

[project.scripts]
acuario = "acuario:main"

[tool.setuptools.packages.find]
include = ["acuario*"]

[tool.setuptools.package-data]
acuario = [
    "py.typed",                              # PEP 561 - ship type info to consumers
    "core/config_data/*.yaml",
    "core/skills/vulnerabilities/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C90"]
ignore = [
    "E501",   # line-too-long - deferred; many tool docstrings exceed 100
    "B008",   # function calls in default args
    "S101",   # assert - used in test-like code and invariant checks
    "S104",   # binding to all interfaces - intentional for proxy/callback servers
    "S108",   # insecure temp file usage - legitimate in sandbox/tool contexts
    "S110",   # try-except-pass - intentional in cleanup/teardown paths
    "S112",   # try-except-continue - intentional in error-tolerant loops
    "S310",   # audit URL open - security tool makes intentional URL requests
    "S311",   # random not for crypto - used for jitter/obfuscation variable names
    "S324",   # insecure hash - used for non-security purposes (checksums, dedup)
    "S603",   # subprocess without shell=True - core tool functionality
    "S607",   # partial executable path - intentional use of system tools
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "E402", "E501", "S"]
"acuario/scanner/runner.py" = ["C901"]
"acuario/agent/tools/hunt/analysis.py" = ["C901"]
"acuario/agent/tools/hunt/discovery.py" = ["C901"]
"acuario/agent/tools/hunt/exploit_tools.py" = ["C901"]
"acuario/scanner/pool.py" = ["C901"]
"acuario/scanner/analyzer.py" = ["C901"]
"acuario/scanner/preprocessor.py" = ["C901"]
"acuario/scanner/reporter.py" = ["C901"]
"acuario/runners/parallel/executor.py" = ["C901"]
"acuario/safety/audit/metrics.py" = ["C901"]
"acuario/analysis/taint_tracker.py" = ["C901"]
# Lab, exploit, and post-audit tooling.  These functions are
# top-level dispatchers with many independent branches (per-section render,
# per-stage exec, per-axis interpretation).  Refactoring just to lower
# cyclomatic count would split one cohesive responsibility into smaller
# helpers without improving readability.
"acuario/scanner/team_discussion_report.py" = ["C901"]
"acuario/scanner/exploit_dev.py" = ["C901"]
"acuario/scanner/exploit_stage.py" = ["C901"]
"acuario/scanner/resume.py" = ["C901"]
"acuario/ui/commands/audit.py" = ["C901"]
"acuario/ui/commands/inspect.py" = ["C901"]
"acuario/ui/narration.py" = ["C901"]
"acuario/providers/openai_oauth.py" = ["E402"]  # late import is intentional -
# the constants block above it documents the OAuth claim path before the
# acuario_home() import resolves the on-disk credential cache location.

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Scoped mypy gate, built up across phases. Every module here runs with
# `disallow_untyped_defs = true` and `warn_unused_ignores = true` - the
# typed-core policy.
#
#   - acuario.findings.*          (Phase 3e)
#   - acuario.capabilities        (Phase 4c)
#   - acuario.scanner.*        (Phase 5 - ~37 untyped-def errors
#                                    cleaned up via real annotations)
#   - acuario.agent.tools.*       (Phase 5 - implicit Optional,
#                                    no-any-return, browser-state None
#                                    narrowing, and a handful of real
#                                    arg-type mismatches all fixed)
#   - acuario.core.*              (Phase 5 - EventBus _handlers/_lock
#                                    class attributes, implicit Optional
#                                    on config/engine/logger/module_loader,
#                                    yaml stub ignore)
[[tool.mypy.overrides]]
module = [
    "acuario.findings.*",
    "acuario.capabilities",
    "acuario.scanner.*",
    "acuario.agent.tools.*",
    "acuario.core.*",
    "acuario.agent.runtime",
    "acuario.agent.protocols",
    "acuario.providers.manager",
]
disallow_untyped_defs = true
warn_unused_ignores = true
